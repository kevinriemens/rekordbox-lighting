[project]
name = "rbxlight"
version = "0.1.0"
description = "Safety-first CLI for rekordbox 6 LightingDB macros"
authors = [{ name = "Kevin Riemens" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "ruamel.yaml>=0.18",
    "questionary>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
# Not a runtime dependency of rbxlight — only for the E1 probe under
# src/rbxlight/experiments/e1_library_join.py, which reads the SQLCipher-
# encrypted rekordbox main library (master.db). See
# docs/experiments/E1-library-join.md and the rekordbox-data-safety skill.
experiments = [
    "pyrekordbox>=0.4",
    "sqlcipher3-wheels>=0.5",
]

[project.scripts]
rbxlight = "rbxlight.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
